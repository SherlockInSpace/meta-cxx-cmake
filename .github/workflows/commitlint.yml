name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: conventional commit messages
    # The runner only needs Node; ubuntu-24.04 is GitHub's current stable Linux runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The lint walks from the base commit to the head, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21

      - name: Lint every commit in the pull request
        run: >
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
